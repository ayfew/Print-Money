name: daily brief

# Why here and not in a Claude routine: the routine sandbox blocks outbound
# CONNECT to query1.finance.yahoo.com and fapi.binance.com, so every market
# returned 403 and the brief had nothing to work with. A GitHub Actions runner
# has ordinary internet access, runs on a schedule whether or not any laptop is
# switched on, and can commit the calendar straight back to main - which is the
# URL a phone subscribes to.

on:
  schedule:
    # 00:17 UTC = 07:17 Asia/Bangkok.
    #
    # Deliberately not on the hour. GitHub runs scheduled workflows on a
    # best-effort basis and drops them under load rather than queueing them, and
    # the top of the hour - 00:00 most of all - is when every cron on the
    # platform fires at once. The first scheduled run this repo ever had was due
    # at 00:00 UTC during an Actions outage and simply never appeared: zero
    # scheduled runs, no failure to look at. Seventeen past the hour costs
    # nothing and misses the stampede.
    - cron: "17 0 * * *"
  workflow_dispatch:            # lets you run it by hand from the Actions tab

concurrency:
  # A fresh group name, and a fresh policy, both for the same reason.
  #
  # The old group was shared with the monthly evidence job and set to
  # cancel-in-progress: false, so anything already in it had to finish before
  # the next run could start. During the Actions outage on 26 August two runs
  # entered that group and never got a runner - still queued 36 hours later -
  # and everything behind them, including the scheduled morning brief, was stuck
  # behind two jobs that will never move. A design where one bad day at GitHub
  # silently stops the product until somebody notices and clicks Cancel is the
  # wrong design.
  #
  # Renaming the group leaves the two zombies sitting harmlessly in the old one
  # and lets new runs through immediately, with nothing to clean up by hand.
  #
  # cancel-in-progress is now true because that is what a daily brief actually
  # wants: if a new one starts while an old one is still going, the old one is
  # producing yesterday's answer and is worth nothing. The two jobs no longer
  # share a group at all - they write disjoint files, and both retry their push
  # on a rebase, so there was never a race to serialise.
  group: daily-brief-run
  cancel-in-progress: true

permissions:
  contents: write               # needed to push the regenerated calendar

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet -r requirements-brief.txt

      - name: Build the brief
        id: brief
        run: |
          python pm.py daily \
            --ics reports/printmoney.ics \
            --html reports/index.html \
            --lang th
        # No `continue-on-error`. pm daily exits non-zero when it could not load
        # enough of the universe to have an opinion, and a failed run that stays
        # visibly red is the point - a green run that quietly wrote "nothing
        # today" over a real brief is the failure mode this guards.

      - name: Check the calendar is still valid iCalendar
        run: |
          python - <<'PY'
          import pathlib, sys
          raw = pathlib.Path("reports/printmoney.ics").read_bytes()
          crlf = raw.count(b"\r\n")
          bare = raw.replace(b"\r\n", b"").count(b"\n")
          print(f"CRLF {crlf}, bare LF {bare}, events {raw.count(b'BEGIN:VEVENT')}")
          if bare or crlf < 10 or not raw.startswith(b"BEGIN:VCALENDAR"):
              sys.exit("calendar is malformed - a phone would silently ignore it")
          PY

      # data/ is committed, unlike state/. The runner starts from a clean
      # checkout every morning, so yesterday's snapshot and the running record
      # of the brief's own calls only exist if git is holding them. Committing
      # the scorecard also means it can be audited commit by commit, which is
      # the only kind of track record worth publishing.
      # The push is the step that actually failed the first time this ran. The
      # job checks out a commit, spends a couple of minutes fetching markets,
      # and by the time it pushes the branch may have moved - a hand-edit, or
      # the monthly evidence job. A plain `git push` then rejects as
      # non-fast-forward and a perfectly good brief is thrown away over a
      # collision that a rebase resolves: this job only ever touches generated
      # files, so there is nothing for a rebase to conflict with.
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/printmoney.ics reports/index.html
          git add data/claims.jsonl data/snapshot.json
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "brief: $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto the current main (attempt $attempt)"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "could not push after three attempts"
          exit 1
