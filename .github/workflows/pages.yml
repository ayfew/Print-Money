name: publish the page

# The page has to be *served* to be readable. raw.githubusercontent.com returns
# text/plain for .html, so the file arrives as source code rather than as a page;
# GitHub Pages serves it properly and gives it a stable URL a phone can bookmark.
#
# One manual step is unavoidable the first time: Settings -> Pages -> Source ->
# "GitHub Actions". Until that is set this workflow fails on the configure step
# and nothing else is affected - the calendar keeps working either way, because
# the calendar is the product and the page is the appendix.

on:
  # Chained rather than scheduled: the page is only worth republishing once the
  # brief that fills it has been rebuilt and pushed.
  workflow_run:
    workflows: ["daily brief"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    # A red brief should not publish a stale page over a good one.
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main            # the brief job just pushed to it

      - name: Check there is something to publish
        run: |
          test -s reports/index.html || {
            echo "reports/index.html is missing or empty"; exit 1; }
          grep -q "__PAYLOAD__" reports/index.html && {
            echo "template placeholder survived into the published page"; exit 1; }
          echo "index.html is $(wc -c < reports/index.html) bytes"

      - name: Verify Pages configuration (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages.json"; then
            echo "::error::Pages is unavailable. After owner approval for public publication, enable Settings > Pages > Source > GitHub Actions. This workflow does not enable Pages or change permissions."
            echo "Pages configuration could not be read; deployment was not attempted. Check site enablement and the token's Pages access." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! jq -e '.build_type == "workflow"' "$RUNNER_TEMP/pages.json" > /dev/null; then
            echo "::error::Pages Source must be GitHub Actions (build_type=workflow). Owner approval is required before changing publication settings."
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports
      - id: deploy
        uses: actions/deploy-pages@v4
